# Blueprint de déploiement Render (plan gratuit).
# Render lit ce fichier pour créer le service automatiquement.
services:
  - type: web
    name: nicko001-dev
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_portfolio"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      # Compte administrateur créé/réinitialisé à chaque déploiement à partir de
      # ces variables (voir la commande ensure_admin dans seed_portfolio).
      # Le mot de passe n'est pas stocké ici : Render te le demandera (secret).
      - key: DJANGO_SUPERUSER_USERNAME
        value: "nicko"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "nickkakaye4@gmail.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Assistant IA : colle ta clé OpenRouter dans le tableau de bord Render (secret).
      - key: OPENROUTER_API_KEY
        sync: false
      # Optionnel : deuxième fournisseur gratuit pour le secours automatique.
      - key: GROQ_API_KEY
        sync: false
# Attention (plan gratuit) : le disque de Render est éphémère. La base SQLite et les
# images téléversées depuis l'admin sont perdues à chaque redéploiement.
# Pour un contenu durable, héberge sur PythonAnywhere (voir README) ou ajoute un
# disque persistant / une base PostgreSQL.
